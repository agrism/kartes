services:
  # 1. PostgreSQL 16 ar PostGIS 3.4 telpiskajam datu kodolam (ARM64 un AMD64 atbalsts)
  db:
    image: postgis/postgis:16-3.4
    container_name: kartes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kartes}
      POSTGRES_USER: ${POSTGRES_USER:-kartes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kartes_secret_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # shm_size ir kritiski svarīgs lieliem PostGIS telpiskajiem vaicājumiem un paralēlajam GIST indeksu darbam
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kartes} -d ${POSTGRES_DB:-kartes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Martin: Rust bāzēts īpaši ātrs vektoru flīžu (MVT) serveris
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: kartes-martin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kartes}:${POSTGRES_PASSWORD:-kartes_secret_password}@db:5432/${POSTGRES_DB:-kartes}
    ports:
      - "${MARTIN_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Go Backend API: Zibenīgs REST API ar pgx/v5 pieslēgumu PostGIS
  api:
    image: ghcr.io/agrism/kartes-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: kartes-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-kartes}:${POSTGRES_PASSWORD:-kartes_secret_password}@db:5432/${POSTGRES_DB:-kartes}
    ports:
      - "${API_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy

  # 4. In-Memory Cache: Redis 7
  cache:
    image: redis:7-alpine
    container_name: kartes-cache
    restart: unless-stopped
    ports:
      - "${CACHE_PORT:-6379}:6379"

  # 5. Frontend UI: React + Vite + MapLibre GL JS (Statisks Nginx Alpine)
  web:
    image: ghcr.io/agrism/kartes-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: kartes-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5180}:80"
    depends_on:
      - api
      - martin

  # 6. pgAdmin: Izvēles Web GUI ģeotelpisko datu, tabulu un vaicājumu apskatei
  # Lai palaistu kopā ar pgAdmin: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kartes-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@kartes.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  # 7. Data Importer: VZD atvērto datu (kadastrs, darījumi, adreses) ielādes rīks
  importer:
    build:
      context: ./importer
      dockerfile: Dockerfile
    container_name: kartes-importer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kartes}:${POSTGRES_PASSWORD:-kartes_secret_password}@db:5432/${POSTGRES_DB:-kartes}
    volumes:
      - ./importer:/app
      - ./web/public/data:/app/web_data
      - data_cache:/app/cache
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pg_data:
    driver: local
  data_cache:
    driver: local
