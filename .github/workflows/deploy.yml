name: Build & Deploy Kartes

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Go Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kartes-api:latest
            ghcr.io/${{ github.repository_owner }}/kartes-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Static React Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kartes-web:latest
            ghcr.io/${{ github.repository_owner }}/kartes-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: "${{ secrets.SSH_PRIVATE_KEY != '' }}"

    steps:
      - name: SSH and Update Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '65.21.182.7' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/kartes.kilograms.lv
            git pull origin main
            docker compose pull api web
            docker compose up -d
            echo "🚀 Deployment successfully completed in seconds without building on server!"
