name: Build & Deploy Kartes

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Go Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/agrism/kartes-api:latest
            ghcr.io/agrism/kartes-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Static React Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/agrism/kartes-web:latest
            ghcr.io/agrism/kartes-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner Production Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '65.21.182.7' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ℹ️ SSH_PRIVATE_KEY is not configured in GitHub repository secrets."
            echo "✅ Docker images were successfully built and pushed to GHCR."
            echo "👉 To enable automatic deployment over SSH, add SSH_PRIVATE_KEY in repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /var/www/kartes.kilograms.lv
            git pull origin main
            docker compose pull api web
            docker compose up -d
            echo "🚀 Deployment successfully completed in seconds without building on server!"
          EOF
